name: Deploy site

# Standby only. Cloudflare Pages builds this site itself from the connected
# repository — see docs/deploy-site.md — so this workflow exists for the day
# that path is unavailable, on the same principle as update.yml.
#
# Deliberately not on `push`: with the Git integration connected, both would
# build and upload the same commit. It also needs CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID, which are not configured, so it fails until someone
# adds them. That is the intended state and not a bug to fix in passing.
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The dataset is not in git. The site's own R2 bucket serves it; the
      # rolling release is the fallback if the bucket is unreachable.
      - name: Fetch the dataset
        run: |
          mkdir -p data
          curl -fsSL --retry 3 https://vindeklaration.se/data/wines.json.gz \
            | gunzip > data/wines.json \
            || curl -fsSL --retry 3 https://github.com/matalve/vindeklaration/releases/download/dataset-latest/wines.json.gz \
            | gunzip > data/wines.json

      - name: Build the site
        # Unset in a fork or a local run, which renders no beacon at all.
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: uv run python -m src.site

      # Cloudflare Pages rejects a deployment over 20 000 files, and the build
      # grows with the assortment. Failing here with the number is far cheaper
      # than a rejected upload with a generic message. See "Bilingual" in
      # docs/site-plan.md for what to do when this trips.
      - name: Check the file count against the Pages limit
        run: |
          count=$(find site -type f | wc -l)
          echo "$count files"
          if [ "$count" -gt 19000 ]; then
            echo "::error::$count files — Cloudflare Pages allows 20 000."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=vindeklaration --branch=main
