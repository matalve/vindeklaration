name: Deploy site

# Standby only. Cloudflare Pages builds this site itself from the connected
# repository — see docs/deploy-site.md — so this workflow exists for the day
# that path is unavailable, on the same principle as update.yml.
#
# Deliberately not on `push`: with the Git integration connected, both would
# build and upload the same commit. It also needs CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID, which are not configured, so it fails until someone
# adds them. That is the intended state and not a bug to fix in passing.
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The same script Cloudflare's own build runs: fetch the dataset, build,
      # and check the file count. Keeping both paths on one definition is the
      # point — the dashboard held a stale copy of these steps for a day.
      - name: Build the site
        run: bash cf-build.sh

      # This is a Worker with static assets, not a Pages project: Cloudflare
      # absorbed Pages into Workers, and `pages deploy` would look for a Pages
      # project that does not exist. See docs/deploy-site.md.
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
