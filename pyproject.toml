[project]
name = "vindeklaration"
version = "0.1.0"
description = "Open dataset of declared additives in wines sold by Systembolaget"
readme = "README.md"
# 3.11 is what Raspberry Pi OS (bookworm) ships, and nothing here needs newer.
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
