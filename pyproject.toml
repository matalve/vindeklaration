[project]
name = "wine-additives"
version = "0.1.0"
description = "Open dataset of declared additives in wines sold by Systembolaget"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
