    name:
      sv: Integrerad produktion (PRODI)
      en: Integrated production (PRODI)
    note:
      sv: Portugisisk/brasiliansk certifiering för hållbart odlade druvor, en lättare regim än ekologisk odling.
      en: A Portuguese/Brazilian certification for sustainably farmed grapes, a lighter regime than organic farming.
    aliases:
      - prodi-druvor
      - prodi druvor
      - prodi

