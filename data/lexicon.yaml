# Statements about handling rather than content.
processing_notes:
  - id: protective_atmosphere
    name:
      sv: Tappad i skyddande atmosfär
      en: Bottled in a protective atmosphere
    # Every supplier words this differently, so it is matched by shape:
    # a bottling verb, optional filler, then the atmosphere.
    regexes:
      - '\b(tappa\w*|tappn\w*|buteljer\w*|flaska\w*|flaskas|bottl\w*|packa\w*|förpacka\w*|fyll\w*)\b[\w\s]{0,24}?\b(skyddande|skyddad|modifierad|protective|inert)\s+(atmosf\w*|atmosphere|miljö\w*)'
      - '\b(skyddande|skyddad|modifierad|protective)\s+(atmosf\w*|atmosphere|miljö\w*)\b'
  - id: organic
    name: { sv: Ekologisk odling, en: Organic farming }
    aliases:
      - produkter från ekologiskt jordbruk
      - produkt från ekologiskt jordbruk
      - från ekologiskt jordbruk
      - från ekologisk jordbruk
      - från ekologisk odling
      - ekologiskt jordbruk
      - ekologisk jordbruk
      - ekologisk odling
      - ekologisk ingrediens
      - organic farming
      - ekologiska
      - ekologisk
      - ekologiskt
      - biologisk
      - biodynamisk
      - organisk
      - organic
      - eko
  - id: vegan
    name: { sv: Vegansk, en: Vegan }
    aliases: [vegansk, veganskt, vegan]
  - id: contains_allergen_notice
    name: { sv: Allergenupplysning, en: Allergen notice }
    aliases: [innehåller allergener, allergener]

