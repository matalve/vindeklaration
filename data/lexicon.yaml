# Statements about handling rather than content.
processing_notes:
  - id: protective_atmosphere
    name:
      sv: Tappad i skyddande atmosfär
      en: Bottled in a protective atmosphere
    # Every occurrence of these bottling verbs in the corpus co-occurs with a
    # protective-atmosphere/gas phrase (checked against the full dataset), so
    # they are recognised on their own rather than only through the regexes
    # below, which struggle with the wildest typos and word orders.
    aliases:
      - syddande atmosfär  # typo for "skyddande atmosfär", missing the k
      - buteljerad
      - buteljerat
      - buteljering
      - butljerad  # typo seen in the wild
      - tappat
      - tappas
      - tappad
      - instoppad  # bottling verb variant, "Instoppad i skyddande atmosfär"
    # Every supplier words this differently, so it is matched by shape: a
    # bottling verb, optional filler, then the atmosphere — in either order,
    # since "under skyddsatmosfär buteljerat" puts the verb last. "skydd" is
    # given a wildcard prefix/suffix and a small gap before "atmo"/"gas" to
    # absorb merges ("enskyddande"), typos ("atmsfär", "afmosfär") and stray
    # inserted words ("skyddan de atmosfär"). "kontrollerad" alongside skydd/
    # modifierad/protective/inert covers "förvarat i en kontrollerad atmosfär".
    regexes:
      - '\b(tappa\w*|tappn\w*|buteljer\w*|butljer\w*|flaska\w*|flaskas|bottl\w*|packa\w*|förpacka\w*|förvara\w*|fyll\w*|producera\w*|condition\w*|ekologisktappa\w*)\b[\w\s]{0,24}?\b(\w*s?kydd\w*|modifierad|kontrollerad|protective|inert).{0,4}?(atmo\w*|atom\w*|afmo\w*|atmsf\w*|atmosphere|miljö\w*|gas\w*)\b'
      - '\b(\w*s?kydd\w*|modifierad|kontrollerad|protective|inert).{0,4}?(atmo\w*|atom\w*|afmo\w*|atmsf\w*|atmosphere|miljö\w*|gas\w*)\b[\w\s]{0,24}?\b(tappa\w*|tappn\w*|buteljer\w*|butljer\w*|flaska\w*|flaskas|bottl\w*|packa\w*|förpacka\w*|förvara\w*|fyll\w*)\b'
      - '\b(\w*s?kydd\w*|modifierad|kontrollerad|protective|inert).{0,4}?(atmo\w*|atom\w*|afmo\w*|atmsf\w*|atmosphere|miljö\w*|gas\w*)\b'
      - '\bbottle\s+conditioned\b'
  - id: organic
    name: { sv: Ekologisk odling, en: Organic farming }
    aliases:
      - produkter från ekologiskt jordbruk
      - produkt från ekologiskt jordbruk
      - från ekologiskt jordbruk
      - från ekologisk jordbruk
      - från ekologisk odling
