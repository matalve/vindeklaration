      - agricoltura biologica
      - da agricoltura biologica
      - biologisk
      - biologique
      - bio
      - biodynamisk
      - organisk
      - organiska
      - organic
      - eko
      - aus kontrolliert ökologischer landwirtschaft  # German, "from certified organic farming"
      - ¹från ekologiskt jordbruk  # footnote marker attached
      - 1från ekologiskt jordbruk  # footnote marker as a plain digit, seen in the wild
      - biologico  # Italian, "mosto concentrato biologico"
