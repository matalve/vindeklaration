# Substance dictionary for Swedish wine ingredient declarations.
#
# Licensed CC BY-SA 4.0 — this file is the project's own work. The dataset
# built from it is not licensed, because the facts in it are not ours to
# license. See LICENSES.md.
#
# Every entry is one substance. `aliases` are the spellings actually seen in
# supplier-entered text, including their misspellings and mistranslations —
# add to this list rather than loosening the matcher.
#
# bucket:
#   additive   counted in additive_count
#   gas        bottling/packaging gases: shown, not counted (see README)
#   base       raw materials: grapes, must, sugar — never counted
#
# group: substances sharing a group suppress the group's generic entry, so
# "kaliumpyrosulfit (SULFITER)" counts as one additive, not two.

- id: sulfites
  e_number: E220-E228
  bucket: additive
  category: preservative
  group: sulfites
  generic: true
  allergen: sulfites
  name: { sv: Sulfiter, en: Sulfites }
  note:
    sv: Samlingsnamn för svavelföreningar som konserverar vinet och skyddar det mot oxidation. Måste alltid deklareras som allergen.
    en: Umbrella term for the sulfur compounds that preserve wine and protect it against oxidation. Always declared as an allergen.
  aliases:
    - sulfiter
    - sulfit
    - sulfite  # English singular
    - sulfites
    - sulphites
    - svavel
    - svav  # truncated mid-word, seen in the wild alongside other named sulfites
    - solfiti
    - sulfiterr  # typo seen in the wild
    - ssulfiter  # typo seen in the wild
    - sulfilter  # typo seen in the wild
    - sufiter  # typo seen in the wild

- id: sulfur_dioxide
  e_number: E220
  bucket: additive
  category: preservative
  group: sulfites
  allergen: sulfites
  name: { sv: Svaveldioxid, en: Sulfur dioxide }
  note:
    sv: Det vanligaste konserveringsmedlet i vin. Hämmar bakterier och oxidation.
    en: The most common wine preservative. Inhibits bacteria and oxidation.
  aliases:
    - svaveldioxid
    - svavaldioxid
    - anidride solforosa
    - sulfur dioxide
    - so2
    - svavlastoxid
    - sulphur dioxide
    - svaveloxid  # typo seen in the wild, missing "di"
    - svaveldoxid  # typo seen in the wild, missing "i"
    - svaveldixoid  # typo seen in the wild, transposed letters
    - svaveldioxis  # typo seen in the wild

- id: potassium_metabisulfite
  e_number: E224
  bucket: additive
  category: preservative
  group: sulfites
  allergen: sulfites
  name: { sv: Kaliumdisulfit, en: Potassium metabisulfite }
  note:
    sv: Fast form av svaveldioxid, tillsätts som pulver vid tappning.
    en: Solid form of sulfur dioxide, added as a powder at bottling.
  aliases:
    - kaliummetabisulfit
    - kaliumpyrosulfit
    - kaliumdisulfit
    - kaliummetabisulfat
    - potassium metabisulphite
    - potassium metabisulfite
    - potassium metabisulfit  # missing the English "-ite" ending
    - metabissulfito de potássio  # Portuguese
    - metabisolfito di potassio  # Italian
    - kaliummetabiolsofyt  # typo seen in the wild
    - kaliumpyrosufit  # typo seen in the wild
    - kaliummetallbisulfit  # typo seen in the wild, "metall" for "meta"
    - kaliumpyrosulfiter  # plural, seen in the wild
    - kaliumdislufit  # typo seen in the wild, letters transposed
    - kaliumoyrosulfit  # typo seen in the wild, o for p
    - kaliumpyrosulfitoch  # merged with "och" (and), no space in the source
    - kaliummetallsulfit  # typo seen in the wild, "metall" for "meta"
    - kalimpyrosulfit  # typo seen in the wild, missing u
    - kaliumpurosulfit  # typo seen in the wild, u for y
    - kalliummetabisulfit  # typo seen in the wild, doubled l
    - kaliumdisulfiter  # plural, seen in the wild
    - kaliummetabisulft  # typo seen in the wild, missing i
  regexes:
    - '\b(meta\s?)?kalium\s?(meta\s?bi|meta|pyro|di)\s?sulfit\b'
    - '\b(meta\s?bi|meta|pyro|di)\s?sulfit\s+av\s+kalium\b'
    # Sodium metabisulfite is not permitted in EU wine, so a bare
    # "metabisulfit" is the potassium salt.
    - '\bmetabisulfit\b'

