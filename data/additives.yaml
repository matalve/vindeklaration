# E501 covers two distinct salts, and declarations name whichever one they used.
# Three wines declare both in the same list, so they cannot share an entry: that
# reads two substances as one and undercounts. The sub-designations are the
# regulation's own, and keeping them apart also avoids a bare "E501" token
# resolving to whichever entry happened to be loaded last — no declaration in
# the corpus writes one today, and if any ever does it should surface as unread
# rather than be attributed to a guess.
- id: potassium_carbonate
  e_number: E501 (i)
  bucket: additive
  category: acidity_regulator
  name: { sv: Kaliumkarbonat, en: Potassium carbonate }
  aliases:
    - kaliumkarbonat
    - potassium carbonate

