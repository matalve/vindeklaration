  aliases: [kaliumbisulfit, kaliumvätesulfit, kaliumbisulf]

- id: potassium_sorbate
  e_number: E202
  bucket: additive
  category: preservative
  name: { sv: Kaliumsorbat, en: Potassium sorbate }
  note:
    sv: Hindrar jäst från att starta om jäsningen i flaskan. Vanligt i söta viner.
    en: Stops yeast restarting fermentation in the bottle. Common in sweet wines.
  aliases: [kaliumsorbat, potassium sorbate]

